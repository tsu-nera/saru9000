[project]
name = "saru9000-wakeword"
version = "0"
requires-python = "==3.11.*"
# Pins follow openWakeWord 0.6.0's training extras; newer audiomentations,
# speechbrain and numpy 2 break its augmentation code.
dependencies = [
    "openwakeword==0.6.0",
    "torch==2.4.1",
    "torchaudio==2.4.1",
    "torchinfo==1.8.0",
    "torchmetrics==0.11.4",
    "speechbrain==0.5.16",
    "audiomentations==0.30.0",
    "torch-audiomentations==0.11.0",
    "acoustics==0.2.6",
    "mutagen==1.47.0",
    "pronouncing==0.2.0",
    "numpy==1.26.4",
    "scipy==1.11.4",
    "onnxruntime==1.19.2",
    "onnx==1.16.2",
    "soundfile",
    "pyarrow<21",
    "pyyaml",
    "tqdm",
    # torchmetrics 0.11 imports pkg_resources, which setuptools 81 dropped.
    "setuptools<81",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cu121" }
torchaudio = { index = "pytorch-cu121" }

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true
