<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>stage</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #202030;
        font-family: system-ui, sans-serif;
      }
      #stage {
        width: 100vw;
        height: 100vh;
        display: block;
        touch-action: none;
      }
      #hud {
        position: fixed;
        left: 12px;
        top: 12px;
        color: #cfd4e0;
        font: 12px/1.6 ui-monospace, monospace;
        white-space: pre-wrap;
        text-shadow: 0 1px 2px #000;
        pointer-events: none;
      }
      #hudMode {
        pointer-events: auto;
        background: none;
        border: 0;
        padding: 0;
        color: inherit;
        font: inherit;
        text-shadow: inherit;
        text-decoration: underline dotted;
        cursor: pointer;
      }
      #hudError {
        color: #ff9a9a;
      }
      #overlay {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(32, 32, 48, 0.85);
        color: #e8ecf5;
        font-size: 28px;
        cursor: pointer;
      }
      #overlay[hidden] {
        display: none;
      }
      #controls {
        position: fixed;
        left: 50%;
        bottom: 20px;
        transform: translateX(-50%);
      }
      #say {
        width: min(70vw, 480px);
        background: #2d3350;
        color: #e8ecf5;
        border: 1px solid #454d75;
        border-radius: 6px;
        padding: 8px 12px;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <canvas id="stage"></canvas>
    <div id="hud">
      <div id="hudState">state: -</div>
      <div><button id="hudMode" type="button" title="クリックで切り替え">mode: -</button></div>
      <div id="hudUtterance"></div>
      <div id="hudError"></div>
    </div>
    <div id="controls">
      <input id="say" type="text" placeholder="話しかける（Enter で送信）" autocomplete="off" />
    </div>
    <div id="overlay">クリックで開始</div>
    <script type="module" src="/src/stage.js"></script>
  </body>
</html>
