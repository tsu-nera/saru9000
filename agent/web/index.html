<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>agent</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #202030;
        font-family: system-ui, sans-serif;
      }
      #stage {
        width: 100vw;
        height: 100vh;
        display: block;
        touch-action: none;
      }
      #hud {
        position: fixed;
        left: 12px;
        top: 12px;
        color: #cfd4e0;
        font: 12px/1.6 ui-monospace, monospace;
        white-space: pre;
        text-shadow: 0 1px 2px #000;
        pointer-events: none;
      }
      #hud.error {
        color: #ff9a9a;
      }
      #controls {
        position: fixed;
        left: 50%;
        bottom: 20px;
        transform: translateX(-50%);
        display: flex;
        gap: 10px;
        align-items: center;
      }
      #controls button {
        background: #2d3350;
        color: #e8ecf5;
        border: 1px solid #454d75;
        border-radius: 6px;
        padding: 8px 18px;
        font-size: 14px;
        cursor: pointer;
      }
      #controls button:hover {
        background: #3a4165;
      }
      #seek {
        width: min(50vw, 420px);
      }
    </style>
  </head>
  <body>
    <canvas id="stage"></canvas>
    <div id="hud">loading...</div>
    <div id="controls" hidden>
      <button id="playPause">⏸ 一時停止</button>
      <input id="seek" type="range" min="0" max="100" value="0" step="1" />
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
