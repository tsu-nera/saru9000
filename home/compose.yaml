services:
  homeassistant:
    container_name: homeassistant
    image: ghcr.io/home-assistant/home-assistant:stable
    volumes:
      - ./config:/config
      - /etc/localtime:/etc/localtime:ro
      - /run/dbus:/run/dbus:ro
    restart: unless-stopped
    privileged: true
    network_mode: host
    environment:
      TZ: Asia/Tokyo

  go2rtc:
    container_name: go2rtc
    image: alexxit/go2rtc:latest
    volumes:
      - ./go2rtc:/config
      # カメラ未接続でも起動できるよう devices: ではなく /dev ごと渡し、cgroup で V4L2(81)・DRI(226) だけ許可する
      - /dev:/dev
    device_cgroup_rules:
      - "c 81:* rmw"
      - "c 226:* rmw"
    restart: unless-stopped
    network_mode: host
    environment:
      TZ: Asia/Tokyo

  # HA の entity を Matter ブリッジとして公開し、Google Home / Nest Mini から音声操作する。
  # 公開対象は HA の entity ラベル「Matter」で選ぶ（ブリッジ設定は Web UI :8482、データは ./matter-hub）
  matter-hub:
    container_name: matter-hub
    image: ghcr.io/riddix/home-assistant-matter-hub:latest
    volumes:
      - ./matter-hub:/data
    restart: unless-stopped
    network_mode: host
    environment:
      TZ: Asia/Tokyo
      HAMH_HOME_ASSISTANT_URL: http://127.0.0.1:8123
      HAMH_HOME_ASSISTANT_ACCESS_TOKEN: ${HAMH_HOME_ASSISTANT_ACCESS_TOKEN}
      # tailscale0 や docker0 のアドレスを広告すると Google Home が届かない側を掴んで Offline になる
      HAMH_MDNS_NETWORK_INTERFACE: wlan0
      HAMH_HTTP_AUTH_USERNAME: admin
      HAMH_HTTP_AUTH_PASSWORD: ${HAMH_HTTP_AUTH_PASSWORD}
