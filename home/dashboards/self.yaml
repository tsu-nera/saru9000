title: 自分
views:
- title: 端末と作業
  path: devices
  icon: mdi:devices
  type: sections
  max_columns: 3
  sections:
  - type: grid
    cards:
    - type: heading
      heading: スマホ
      icon: mdi:cellphone
    - type: tile
      entity: sensor.bv5200_pro_battery_level
      grid_options:
        columns: 6
      name: BV5200 Pro 電池
    - type: tile
      entity: sensor.bv5200_pro_battery_state
      grid_options:
        columns: 6
      name: BV5200 Pro 充電
    - type: tile
      entity: sensor.xiaomi_battery_level
      grid_options:
        columns: 6
      name: Xiaomi 電池
    - type: tile
      entity: sensor.xiaomi_battery_state
      grid_options:
        columns: 6
      name: Xiaomi 充電
    - type: tile
      entity: device_tracker.bv5200_pro
      grid_options:
        columns: 6
      name: BV5200 Pro 在宅
    - type: tile
      entity: sensor.xiaomi_next_alarm
      grid_options:
        columns: 6
      name: 次のアラーム
  - type: grid
    cards:
    - type: heading
      heading: Charge 6
      icon: mdi:watch
    - type: tile
      entity: sensor.charge_6_battery
      name: 電池
      grid_options:
        columns: 6
    - type: tile
      entity: sensor.charge_6_last_sync_time
      name: 最終同期
      grid_options:
        columns: 6
  - type: grid
    cards:
    - type: heading
      heading: 周辺機器の電池
      icon: mdi:battery-charging
    - type: tile
      entity: sensor.bt_mouse_battery
      name: マウス
      grid_options:
        columns: 6
    # スマホ経由（#142）は繋いだ時にしか届かないので、いつの値かを添える
    - type: tile
      entity: sensor.liberty_battery
      name: Liberty 4 Pro
      state_content: [state, last_updated]
      grid_options:
        columns: 6
    - type: tile
      entity: sensor.liberty_case_battery
      name: Liberty 4 Pro ケース
      state_content: [state, last_updated]
      grid_options:
        columns: 6
    - type: tile
      entity: sensor.xm3_battery
      name: WH-1000XM3
      state_content: [state, last_updated]
      grid_options:
        columns: 6
    - type: tile
      entity: sensor.wimax_battery
      name: WiMAX
      state_content: [state, last_updated]
      grid_options:
        columns: 6
    - type: tile
      entity: sensor.tickr_battery
      name: TICKR
      state_content: [state, last_updated]
      grid_options:
        columns: 6
  - type: grid
    cards:
    - type: heading
      heading: iiyama（PC）
      icon: mdi:laptop
    - type: tile
      entity: sensor.iiyama_active_app
      grid_options:
        columns: full
      name: 使っているアプリ
    - type: tile
      entity: sensor.iiyama_active_window_title
      grid_options:
        columns: full
      name: ウィンドウ
    - type: tile
      entity: binary_sensor.iiyama_idle
      grid_options:
        columns: 6
      name: 離席
    - type: tile
      entity: sensor.iiyama_bat_battery_level
      grid_options:
        columns: 6
      name: 電池
    - type: tile
      entity: sensor.iiyama_screen_time_today
      name: 今日の使用時間
      grid_options:
        columns: 6
    - type: tile
      entity: sensor.iiyama_most_used_app_today
      name: 一番使ったアプリ
      grid_options:
        columns: 6
  - type: grid
    column_span: 3
    cards:
    - type: heading
      heading: 画面時間
      icon: mdi:monitor-dashboard
    - type: markdown
      title: iiyama の上位アプリ（今日）
      content: |-
        {% set apps = state_attr('sensor.iiyama_screen_time_today', 'top_apps') or [] %}
        {% if apps %}| アプリ | 分 |
        |---|--:|
        {% for a in apps %}| {{ a.app }} | {{ a.minutes }} |
        {% endfor %}{% else %}今日はまだ記録がありません{% endif %}
      grid_options:
        columns: 6
    - type: statistics-graph
      title: iiyama の使用時間（日ごと）
      entities:
      - sensor.iiyama_screen_time_today
      period: day
      days_to_show: 7
      stat_types:
      - change
      chart_type: bar
      hide_legend: true
      grid_options:
        columns: 6
