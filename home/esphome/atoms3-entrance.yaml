# 玄関の ATOMS3 Lite（SESAME 5・間接照明の赤外線・人感センサーを担う予定）
esphome:
  name: atoms3-entrance
  friendly_name: 玄関 ATOMS3
  platformio_options:
    build_flags:
      - -DUSE_FRAMEWORK_MBEDTLS_CMAC

esp32:
  board: m5stack-atoms3
  framework:
    type: esp-idf
    # esphome-sesame3 が要る NimBLE の設定（README の ESPHome 2025.10.0 以降の例）
    sdkconfig_options:
      CONFIG_BT_ENABLED: y
      CONFIG_BT_NIMBLE_ENABLED: y
      CONFIG_BT_NIMBLE_MAX_CONNECTIONS: "1"
      CONFIG_BT_NIMBLE_CRYPTO_STACK_MBEDTLS: y
      CONFIG_BT_NIMBLE_ROLE_BROADCASTER_DISABLED: y
      CONFIG_BT_NIMBLE_ROLE_PERIPHERAL_DISABLED: y
      # README の例に無い。ESPHome 2026.10 の esp-idf では CCM が無いとリンクで落ちた
      CONFIG_MBEDTLS_CCM_C: y
      CONFIG_MBEDTLS_CMAC_C: y

# ESPHome 組み込みの BLE（esp32_ble_tracker 等）とは同居できない
external_components:
  - source:
      type: git
      url: https://github.com/homy-newfs8/esphome-sesame3
      ref: v0.31.0
    components: [sesame, sesame_ble]

sesame:
  model: sesame_5
  uuid: !secret sesame_uuid
  secret: !secret sesame_secret
  connect_retry_limit: 0
  battery_pct:
    name: SESAME 電池残量
  connection_sensor:
    name: SESAME 接続
  lock:
    id: entrance_lock
    name: SESAME
    tag: saru9000
    history_tag:
      name: SESAME 操作者

logger:
  hardware_uart: USB_SERIAL_JTAG

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  # 建物 Wi-Fi は同名 AP が複数あり、AP によっては vaio（HA）から届かない（saru9000 #55）。届く AP に固定する
  networks:
    - ssid: !secret wifi_ssid
      password: !secret wifi_password
      bssid: !secret wifi_bssid
  ap:
    password: !secret fallback_ap_password

sensor:
  - platform: wifi_signal
    name: Wi-Fi 電波強度
    update_interval: 60s

light:
  - platform: esp32_rmt_led_strip
    name: LED
    id: led
    pin: GPIO35
    num_leds: 1
    chipset: WS2812
    rgb_order: GRB
    # 既定では RMT の送信メモリ（S3 は 192 symbols）を全部取り、remote_transmitter が FAILED になる
    rmt_symbols: 48

binary_sensor:
  - platform: gpio
    name: ボタン
    pin:
      number: GPIO41
      inverted: true
    # 押すたびに間接照明の ON/OFF を交互に送る（赤外線が届くか照明のそばで試す用）。LED が点いている＝最後に ON を送った
    on_press:
      - if:
          condition:
            light.is_on: led
          then:
            - button.press: indirect_off
            - light.turn_off: led
          else:
            - button.press: indirect_on
            - light.turn_on:
                id: led
                brightness: 30%
                red: 100%
                green: 60%
                blue: 0%

  # PIR Unit（AS312）。Grove の信号は GPIO1（GPIO2 は反応しなかった）
  - platform: gpio
    name: 人感
    id: pir
    pin: GPIO1
    device_class: motion

# 間接照明（OHM OCR-05W）。信号は home/ir/ohm_ocr05w.py と同じ（38kHz、LSB first、ON=0x3C・OFF=0xD2 を3回）
remote_transmitter:
  pin: GPIO4
  carrier_duty_percent: 50%

button:
  - platform: template
    name: 間接照明 ON
    id: indirect_on
    on_press:
      - logger.log: "indirect ON pressed"
      - remote_transmitter.transmit_raw:
          carrier_frequency: 38kHz
          code: [2600, -2600, 800, -800, 800, -800, 800, -1800, 800, -1800, 800, -1800, 800, -1800, 800, -800, 800, -800, 800]
          repeat:
            times: 3
            wait_time: 20ms
  - platform: template
    name: 間接照明 OFF
    id: indirect_off
    on_press:
      - logger.log: "indirect OFF pressed"
      - remote_transmitter.transmit_raw:
          carrier_frequency: 38kHz
          code: [2600, -2600, 800, -800, 800, -1800, 800, -800, 800, -800, 800, -1800, 800, -800, 800, -1800, 800, -1800, 800]
          repeat:
            times: 3
            wait_time: 20ms
