# 照明の組み合わせの定義。voice_commands.yaml の sentence trigger と core の run_action が呼ぶ。
# ダッシュボードで天井の電球 3 つをまとめて点け消し・調光するための group。
# Area に入れない: 入れると area_id: mein の操作（script.lights の all、声の「電気つけて」）が電球に二重に届く。
light:
  - platform: group
    name: 天井の電球
    # entity ID は registry で light.ceiling に付け替えてある（日本語名からは中国語読みになる）
    unique_id: ceiling_group
    entities:
      - light.ceiling_left
      - light.ceiling_center
      - light.ceiling_right

script:
  ceiling_brightness:
    alias: 天井の明るさ
    description: >-
      天井の電球 3 つを指定の明るさで点ける。色は変えない。
      明るさを渡すので、消すまで Adaptive Lighting の追従から外れる。
    mode: restart
    fields:
      pct:
        name: 明るさ
        description: 明るさ（%）。
        required: true
        selector:
          number:
            min: 1
            max: 100
            unit_of_measurement: "%"
    sequence:
      - action: light.turn_on
        target:
          entity_id: light.ceiling
        data:
          brightness_pct: "{{ pct | int }}"
  lights:
    alias: 照明
    description: >-
      照明をつける・消す。明るさ・色は変えない（天井灯は Adaptive Lighting が時間帯の値で点ける）。
    mode: queued
    fields:
      target:
        name: 対象
        description: どの照明か。ceiling は天井の電球 3 つ、all は部屋の照明全部と玄関の間接照明。
        required: true
        selector:
          select:
            options:
              - label: 間接照明
                value: indirect
              - label: 天井の電球
                value: ceiling
              - label: 全部
                value: all
      # 引用符を外すと YAML の真偽値 True になり、フィールド名が on でなくなる。
      "on":
        name: 点けるか
        description: true で点け、false で消す。
        required: true
        # boolean: {} だと script の読み込みで「Only one type can be specified」になり script ごと無効になる。
        selector:
          boolean:
    # 明るさ・色を渡さないのは、渡すと Adaptive Lighting が手動扱いにして追従を止めるため。
    variables:
      entities: >-
        {% if target == 'indirect' %}{{ ['light.indirect_light'] }}
        {%- elif target == 'ceiling' %}{{ ['light.ceiling_left', 'light.ceiling_center', 'light.ceiling_right'] }}
        {%- elif target == 'all' %}{{ area_entities('mein') | select('match', 'light\.') | list + ['light.indirect_light'] }}
        {%- else %}{{ [] }}{% endif %}
    sequence:
      - condition: template
        value_template: "{{ entities | count > 0 }}"
      - if:
          - condition: template
            value_template: "{{ on | bool }}"
        then:
          - action: light.turn_on
            target:
              entity_id: "{{ entities }}"
        else:
          - action: light.turn_off
            target:
              entity_id: "{{ entities }}"
