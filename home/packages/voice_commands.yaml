# core（声で話しかけるキャラクター）が /api/conversation/process に渡した文に一致した時の操作。
# 一致しなければ core は Claude に回す。返事は set_conversation_response で HA が決める。
automation:
  - id: voice_kansetsu_shoumei_on
    alias: Voice Kansetsu Shoumei On
    description: >-
      「間接照明つけて」と言われたら間接照明を点け、「間接照明つけます」と返す。
    mode: single
    triggers:
      - trigger: conversation
        command:
          - "間接照明[を](つけて|点けて|付けて|オンにして)"
    actions:
      # 返事を先に決める。赤外線の送信が遅くても返事が遅れないようにするため。
      # HA が automation の終了を待ってから返事するかは未確認。
      - set_conversation_response: "間接照明つけます"
      - action: light.turn_on
        target:
          entity_id: light.kansetsu_shoumei

  - id: voice_kansetsu_shoumei_off
    alias: Voice Kansetsu Shoumei Off
    description: >-
      「間接照明消して」と言われたら間接照明を消し、「間接照明消します」と返す。
    mode: single
    triggers:
      - trigger: conversation
        command:
          - "間接照明[を](消して|けして|オフにして)"
    actions:
      # 返事を先に決める理由は上と同じ。
      - set_conversation_response: "間接照明消します"
      - action: light.turn_off
        target:
          entity_id: light.kansetsu_shoumei

  - id: voice_tenjoutou_on
    alias: Voice Tenjoutou On
    description: >-
      「天井灯つけて」と言われたら天井の電球 3 つを点け、「天井灯つけます」と返す。
      明るさ・色は渡さない（渡すと Adaptive Lighting が手動扱いにして追従を止める）。
    mode: single
    triggers:
      - trigger: conversation
        command:
          - "天井灯[を](つけて|点けて|付けて|オンにして)"
    actions:
      - set_conversation_response: "天井灯つけます"
      - action: light.turn_on
        target:
          entity_id:
            - light.denkyu_hidari
            - light.denkyu_chuo
            - light.denkyu_migi

  - id: voice_tenjoutou_off
    alias: Voice Tenjoutou Off
    description: >-
      「天井灯消して」と言われたら天井の電球 3 つを消し、「天井灯消します」と返す。
    mode: single
    triggers:
      - trigger: conversation
        command:
          - "天井灯[を](消して|けして|オフにして)"
    actions:
      - set_conversation_response: "天井灯消します"
      - action: light.turn_off
        target:
          entity_id:
            - light.denkyu_hidari
            - light.denkyu_chuo
            - light.denkyu_migi

  - id: voice_denki_on
    alias: Voice Denki On
    description: >-
      「電気つけて」と言われたら Area mein の light を全部点け、「電気つけます」と返す。
      明るさ・色は渡さない（天井灯は Adaptive Lighting が時間帯の値で点ける）。
    mode: single
    triggers:
      - trigger: conversation
        command:
          - "[全部の|部屋の]電気[を](つけて|点けて|付けて|オンにして)"
    actions:
      - set_conversation_response: "電気つけます"
      - action: light.turn_on
        target:
          area_id: mein

  - id: voice_denki_off
    alias: Voice Denki Off
    description: >-
      「電気消して」と言われたら Area mein の light を全部消し、「電気消します」と返す。
    mode: single
    triggers:
      - trigger: conversation
        command:
          - "[全部の|部屋の]電気[を](消して|けして|オフにして)"
    actions:
      - set_conversation_response: "電気消します"
      - action: light.turn_off
        target:
          area_id: mein
