# core（声で話しかけるキャラクター）が /api/conversation/process に渡した文に一致した時の操作。
# 一致しなければ core は Claude に回す。返事は set_conversation_response で HA が決める。
automation:
  - id: voice_indirect_light_on
    alias: Voice Indirect Light On
    description: >-
      「間接照明つけて」と言われたら間接照明を点け、「間接照明つけます」と返す。
    mode: single
    triggers:
      - trigger: conversation
        command:
          - "間接照明[を](つけて|点けて|付けて|オンにして)"
    actions:
      # 返事を先に決める。赤外線の送信が遅くても返事が遅れないようにするため。
      # HA が automation の終了を待ってから返事するかは未確認。
      - set_conversation_response: "間接照明つけます"
      - action: light.turn_on
        target:
          entity_id: light.indirect_light

  - id: voice_indirect_light_off
    alias: Voice Indirect Light Off
    description: >-
      「間接照明消して」と言われたら間接照明を消し、「間接照明消します」と返す。
    mode: single
    triggers:
      - trigger: conversation
        command:
          - "間接照明[を](消して|けして|オフにして)"
    actions:
      # 返事を先に決める理由は上と同じ。
      - set_conversation_response: "間接照明消します"
      - action: light.turn_off
        target:
          entity_id: light.indirect_light

  - id: voice_ceiling_light_on
    alias: Voice Ceiling Light On
    description: >-
      「天井灯つけて」と言われたら天井の電球 3 つを点け、「天井灯つけます」と返す。
      明るさ・色は渡さない（渡すと Adaptive Lighting が手動扱いにして追従を止める）。
    mode: single
    triggers:
      - trigger: conversation
        command:
          - "天井灯[を](つけて|点けて|付けて|オンにして)"
    actions:
      - set_conversation_response: "天井灯つけます"
      - action: light.turn_on
        target:
          entity_id:
            - light.ceiling_left
            - light.ceiling_center
            - light.ceiling_right

  - id: voice_ceiling_light_off
    alias: Voice Ceiling Light Off
    description: >-
      「天井灯消して」と言われたら天井の電球 3 つを消し、「天井灯消します」と返す。
    mode: single
    triggers:
      - trigger: conversation
        command:
          - "天井灯[を](消して|けして|オフにして)"
    actions:
      - set_conversation_response: "天井灯消します"
      - action: light.turn_off
        target:
          entity_id:
            - light.ceiling_left
            - light.ceiling_center
            - light.ceiling_right

  - id: voice_all_lights_on
    alias: Voice All Lights On
    description: >-
      「電気つけて」と言われたら Area mein の light を全部点け、「電気つけます」と返す。
      明るさ・色は渡さない（天井灯は Adaptive Lighting が時間帯の値で点ける）。
    mode: single
    triggers:
      - trigger: conversation
        command:
          - "[全部の|部屋の]電気[を](つけて|点けて|付けて|オンにして)"
    actions:
      - set_conversation_response: "電気つけます"
      - action: light.turn_on
        target:
          area_id: mein

  - id: voice_all_lights_off
    alias: Voice All Lights Off
    description: >-
      「電気消して」と言われたら Area mein の light を全部消し、「電気消します」と返す。
    mode: single
    triggers:
      - trigger: conversation
        command:
          - "[全部の|部屋の]電気[を](消して|けして|オフにして)"
    actions:
      - set_conversation_response: "電気消します"
      - action: light.turn_off
        target:
          area_id: mein

  # ここから下の明るさ・色温度・自動に戻すは聞き取りの揺れを候補に並べる。
  # ReazonSpeech は「天井灯」を「添乗灯」「天井棟」「天井糖」「天井等」と書くことがある。
  - id: voice_ceiling_light_brightness
    alias: Voice Ceiling Light Brightness
    description: >-
      「天井灯を50%にして」と言われたら天井の電球 3 つをその明るさにし、「天井灯を50%にします」と返す。
      Adaptive Lighting は電球を手動扱いにして追従を止める（「自動に戻して」で戻す）。
    mode: single
    # ReazonSpeech は数を漢数字で、「パーセント」を「％」で書くため、可変部分にせず
    # 10% 刻みの候補を並べ、trigger の id を明るさの値にする。
    # 「%」を省略可にすると「天井灯をオンにして」と取り合うので必須。
    triggers:
      - trigger: conversation
        id: "10"
        command:
          - "(天井灯|添乗灯|天井棟|天井糖|天井等)[の明るさ][を](10|十)(%|％|パーセント)[に]して"
      - trigger: conversation
        id: "20"
        command:
          - "(天井灯|添乗灯|天井棟|天井糖|天井等)[の明るさ][を](20|二十)(%|％|パーセント)[に]して"
      - trigger: conversation
        id: "30"
        command:
          - "(天井灯|添乗灯|天井棟|天井糖|天井等)[の明るさ][を](30|三十)(%|％|パーセント)[に]して"
      - trigger: conversation
        id: "40"
        command:
          - "(天井灯|添乗灯|天井棟|天井糖|天井等)[の明るさ][を](40|四十)(%|％|パーセント)[に]して"
      - trigger: conversation
        id: "50"
        command:
          - "(天井灯|添乗灯|天井棟|天井糖|天井等)[の明るさ][を](50|五十)(%|％|パーセント)[に]して"
      - trigger: conversation
        id: "60"
        command:
          - "(天井灯|添乗灯|天井棟|天井糖|天井等)[の明るさ][を](60|六十)(%|％|パーセント)[に]して"
      - trigger: conversation
        id: "70"
        command:
          - "(天井灯|添乗灯|天井棟|天井糖|天井等)[の明るさ][を](70|七十)(%|％|パーセント)[に]して"
      - trigger: conversation
        id: "80"
        command:
          - "(天井灯|添乗灯|天井棟|天井糖|天井等)[の明るさ][を](80|八十)(%|％|パーセント)[に]して"
      - trigger: conversation
        id: "90"
        command:
          - "(天井灯|添乗灯|天井棟|天井糖|天井等)[の明るさ][を](90|九十)(%|％|パーセント)[に]して"
      - trigger: conversation
        id: "100"
        command:
          - "(天井灯|添乗灯|天井棟|天井糖|天井等)[の明るさ][を](100|百)(%|％|パーセント)[に]して"
    actions:
      - set_conversation_response: "天井灯を{{ trigger.id }}%にします"
      - action: light.turn_on
        target:
          entity_id:
            - light.ceiling_left
            - light.ceiling_center
            - light.ceiling_right
        data:
          brightness_pct: "{{ trigger.id | int }}"

  - id: voice_ceiling_light_warm
    alias: Voice Ceiling Light Warm
    description: >-
      「天井灯を電球色にして」と言われたら天井の電球 3 つを 2700K にし、「天井灯を電球色にします」と返す。
    mode: single
    triggers:
      - trigger: conversation
        command:
          - "(天井灯|添乗灯|天井棟|天井糖|天井等)[を](暖色にして|電球色にして|電球食にして|オレンジにして)"
    actions:
      - set_conversation_response: "天井灯を電球色にします"
      - action: light.turn_on
        target:
          entity_id:
            - light.ceiling_left
            - light.ceiling_center
            - light.ceiling_right
        data:
          color_temp_kelvin: 2700

  - id: voice_ceiling_light_neutral
    alias: Voice Ceiling Light Neutral
    description: >-
      「天井灯を昼白色にして」と言われたら天井の電球 3 つを 5000K にし、「天井灯を昼白色にします」と返す。「昼食」は「昼白色」の聞き取り違い。
    mode: single
    triggers:
      - trigger: conversation
        command:
          - "(天井灯|添乗灯|天井棟|天井糖|天井等)[を](白にして|白色にして|昼白色にして|昼食にして)"
    actions:
      - set_conversation_response: "天井灯を昼白色にします"
      - action: light.turn_on
        target:
          entity_id:
            - light.ceiling_left
            - light.ceiling_center
            - light.ceiling_right
        data:
          color_temp_kelvin: 5000

  - id: voice_ceiling_light_daylight
    alias: Voice Ceiling Light Daylight
    description: >-
      「天井灯を昼光色にして」と言われたら天井の電球 3 つを 6500K にし、「天井灯を昼光色にします」と返す。「重光色」は「昼光色」の聞き取り違い。
    mode: single
    triggers:
      - trigger: conversation
        command:
          - "(天井灯|添乗灯|天井棟|天井糖|天井等)[を](昼光色にして|重光色にして|青白くして)"
    actions:
      - set_conversation_response: "天井灯を昼光色にします"
      - action: light.turn_on
        target:
          entity_id:
            - light.ceiling_left
            - light.ceiling_center
            - light.ceiling_right
        data:
          color_temp_kelvin: 6500

  - id: voice_ceiling_light_auto
    alias: Voice Ceiling Light Auto
    description: >-
      「天井灯を自動に戻して」と言われたら天井の電球 3 つの手動扱いを解き、Adaptive Lighting の追従に戻す。
    mode: single
    triggers:
      - trigger: conversation
        command:
          - "(天井灯|添乗灯|天井棟|天井糖|天井等)[を]自動に戻して"
    actions:
      - set_conversation_response: "天井灯を自動に戻します"
      - action: adaptive_lighting.set_manual_control
        data:
          entity_id: switch.adaptive_lighting_ceiling
          lights:
            - light.ceiling_left
            - light.ceiling_center
            - light.ceiling_right
          manual_control: false

  - id: voice_aircon_on
    alias: Voice Aircon On
    description: >-
      「エアコンつけて」と言われたら最後に使ったモードでエアコンを動かし、「エアコンつけます」と返す。
    mode: single
    triggers:
      - trigger: conversation
        command:
          - "エアコン[を](つけて|点けて|付けて|オンにして)"
    actions:
      - set_conversation_response: "エアコンつけます"
      - action: script.aircon_power_on

  - id: voice_aircon_off
    alias: Voice Aircon Off
    description: >-
      「エアコン消して」と言われたらエアコンを止め、「エアコン消します」と返す。
    mode: single
    triggers:
      - trigger: conversation
        command:
          - "エアコン[を](消して|けして|止めて|とめて|オフにして)"
    actions:
      - set_conversation_response: "エアコン消します"
      - action: climate.set_hvac_mode
        target:
          entity_id: climate.aircon
        data:
          hvac_mode: "off"

  - id: voice_aircon_mode
    alias: Voice Aircon Mode
    description: >-
      「エアコンを冷房にして」などでモードを変え（止まっていれば動く）、「冷房にします」と返す。
    mode: single
    # 「暖房」「除湿」を単独で言うと ReazonSpeech が「だんごう」「除室」などに崩すので、その表記も並べる。
    # 「エアコンを〇〇にして」の形は崩れなかった。
    triggers:
      - trigger: conversation
        id: cool
        command:
          - "エアコンを冷房にして"
          - "冷房[を](つけて|にして)"
      - trigger: conversation
        id: heat
        command:
          - "エアコンを暖房にして"
          - "(暖房|だんぼう|だんごう|だんご)[を](つけて|にして)"
      - trigger: conversation
        id: dry
        command:
          - "エアコンを(除湿|ドライ)にして"
          - "(除湿|除室|ドライ)[を](つけて|にして)"
      - trigger: conversation
        id: fan_only
        command:
          - "エアコンを送風にして"
          - "送風[を](つけて|にして)"
      - trigger: conversation
        id: auto
        command:
          - "エアコンを自動にして"
    variables:
      names:
        cool: 冷房
        heat: 暖房
        dry: 除湿
        fan_only: 送風
        auto: 自動
    actions:
      - set_conversation_response: "{{ names[trigger.id] }}にします"
      - action: climate.set_hvac_mode
        target:
          entity_id: climate.aircon
        data:
          hvac_mode: "{{ trigger.id }}"

  - id: voice_aircon_temperature
    alias: Voice Aircon Temperature
    description: >-
      「エアコンを26度にして」と言われたら設定温度を変え（止まっていれば動く）、「エアコンを26度にします」と返す。
    mode: single
    # ReazonSpeech は数を漢数字で、「度」を「℃」で書くことがあるので、1 度刻みの候補を並べ trigger の id を温度にする。
    triggers:
      - trigger: conversation
        id: "16"
        command:
          - "エアコン[の温度]を(16|十六)(度|℃)[に]して"
      - trigger: conversation
        id: "17"
        command:
          - "エアコン[の温度]を(17|十七)(度|℃)[に]して"
      - trigger: conversation
        id: "18"
        command:
          - "エアコン[の温度]を(18|十八)(度|℃)[に]して"
      - trigger: conversation
        id: "19"
        command:
          - "エアコン[の温度]を(19|十九)(度|℃)[に]して"
      - trigger: conversation
        id: "20"
        command:
          - "エアコン[の温度]を(20|二十)(度|℃)[に]して"
      - trigger: conversation
        id: "21"
        command:
          - "エアコン[の温度]を(21|二十一)(度|℃)[に]して"
      - trigger: conversation
        id: "22"
        command:
          - "エアコン[の温度]を(22|二十二)(度|℃)[に]して"
      - trigger: conversation
        id: "23"
        command:
          - "エアコン[の温度]を(23|二十三)(度|℃)[に]して"
      - trigger: conversation
        id: "24"
        command:
          - "エアコン[の温度]を(24|二十四)(度|℃)[に]して"
      - trigger: conversation
        id: "25"
        command:
          - "エアコン[の温度]を(25|二十五)(度|℃)[に]して"
      - trigger: conversation
        id: "26"
        command:
          - "エアコン[の温度]を(26|二十六)(度|℃)[に]して"
      - trigger: conversation
        id: "27"
        command:
          - "エアコン[の温度]を(27|二十七)(度|℃)[に]して"
      - trigger: conversation
        id: "28"
        command:
          - "エアコン[の温度]を(28|二十八)(度|℃)[に]して"
      - trigger: conversation
        id: "29"
        command:
          - "エアコン[の温度]を(29|二十九)(度|℃)[に]して"
      - trigger: conversation
        id: "30"
        command:
          - "エアコン[の温度]を(30|三十)(度|℃)[に]して"
    actions:
      - set_conversation_response: "エアコンを{{ trigger.id }}度にします"
      - action: script.aircon_power_on
      - action: climate.set_temperature
        target:
          entity_id: climate.aircon
        data:
          temperature: "{{ trigger.id | int }}"

  - id: voice_aircon_temperature_step
    alias: Voice Aircon Temperature Step
    description: >-
      「エアコンの温度を上げて／下げて」で設定温度を 1 度変え（16〜30 度に収める）、「エアコンを27度にします」と返す。
      基準は HA が覚えている設定温度（本体のリモコンで変えるとずれる）。
    mode: single
    triggers:
      - trigger: conversation
        id: "1"
        command:
          - "エアコン[の温度]を(上げて|あげて)"
      - trigger: conversation
        id: "-1"
        command:
          - "エアコン[の温度]を(下げて|さげて)"
    variables:
      target: >-
        {{ [[(state_attr('climate.aircon', 'temperature') | float(25)) + (trigger.id | int), 16] | max, 30] | min | int }}
    actions:
      - set_conversation_response: "エアコンを{{ target }}度にします"
      - action: script.aircon_power_on
      - action: climate.set_temperature
        target:
          entity_id: climate.aircon
        data:
          temperature: "{{ target }}"

  - id: voice_aircon_fan
    alias: Voice Aircon Fan
    description: >-
      「風を強く／弱く／自動にして」で風量を 1 段変えるか自動にし（止まっていれば動く）、「風を強くします」などと返す。
      自動からの強く・弱くは 3 段目を基準にする。
    mode: single
    # 「風量」は「風邪量」「風邪竜」に崩れることがある。
    triggers:
      - trigger: conversation
        id: up
        command:
          - "(風|かぜ|風量|風邪量|風邪竜)[を](強く|つよく)して"
      - trigger: conversation
        id: down
        command:
          - "(風|かぜ|風量|風邪量|風邪竜)[を](弱く|よわく)して"
      - trigger: conversation
        id: auto
        command:
          - "(風|かぜ|風量|風邪量|風邪竜)[を](自動|じどう)にして"
    variables:
      current: "{{ state_attr('climate.aircon', 'fan_mode') | int(3) }}"
      fan: >-
        {% if trigger.id == 'auto' %}auto
        {%- elif trigger.id == 'up' %}{{ [current + 1, 5] | min }}
        {%- else %}{{ [current - 1, 1] | max }}{% endif %}
      replies:
        up: 風を強くします
        down: 風を弱くします
        auto: 風を自動にします
    actions:
      - set_conversation_response: "{{ replies[trigger.id] }}"
      - action: script.aircon_power_on
      - action: climate.set_fan_mode
        target:
          entity_id: climate.aircon
        data:
          fan_mode: "{{ fan }}"

  - id: voice_gomi_tomorrow
    alias: Voice Gomi Tomorrow
    description: >-
      「明日のゴミは」「明日は何ゴミ」と聞かれたら sensor.gomi_tomorrow のメッセージで答える（機器は動かさない）。
    mode: single
    # ReazonSpeech の表記揺れ（ゴミ/ごみ）と、助詞・「何」の有無を省略可にする。
    triggers:
      - trigger: conversation
        command:
          - "明日[の](ゴミ|ごみ)[は|って][何|なに]"
          - "明日は[何|なに](ゴミ|ごみ)"
    actions:
      - set_conversation_response: "{{ state_attr('sensor.gomi_tomorrow', 'message') }}"
