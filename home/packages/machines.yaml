# マシン監視ビューの「生きているか」。go-hass-agent の sensor は電源断・スリープ・回線断でも最後の値のまま残るので、
# CPU 使用率（1分ごとに送られてくる）の last_reported が途切れたら offline とみなす。vaio は HA 自身が動いているので作らない。
template:
  - binary_sensor:
      - name: mouse オンライン
        unique_id: mouse_online
        default_entity_id: binary_sensor.mouse_online
        device_class: connectivity
        state: >-
          {{ states.sensor.mouse_cpu_use is not none
             and now() - states.sensor.mouse_cpu_use.last_reported < timedelta(minutes=3) }}
      - name: iiyama オンライン
        unique_id: iiyama_online
        default_entity_id: binary_sensor.iiyama_online
        device_class: connectivity
        state: >-
          {{ states.sensor.iiyama_cpu_use is not none
             and now() - states.sensor.iiyama_cpu_use.last_reported < timedelta(minutes=3) }}

# mouse を寝た状態から起こす。既定の 255.255.255.255 へのブロードキャストで届く（ARP の固定や IP 宛ては要らない）。
# 確実なのは有線（建物 LAN に挿している時）で、WoWLAN は届かない日があったので両方へ送る。MAC は vaio の git 外 secrets.yaml。
wake_on_lan:

script:
  wake_mouse:
    alias: mouse を起こす
    icon: mdi:power
    mode: single
    sequence:
      - action: wake_on_lan.send_magic_packet
        data:
          mac: !secret mouse_wired_mac
      - action: wake_on_lan.send_magic_packet
        data:
          mac: !secret mouse_wifi_mac
