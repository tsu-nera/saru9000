# Google の同名ルーティンが Matter Hub 経由で「オン」にする script（label `matter`）。
# Matter からは引数を渡せないので、照明は script.lights を固定の引数で呼ぶ。
script:
  # 名前をルーティンの開始フレーズ「おやすみ」と同じにすると、Gemini for Home が
  # 「おやすみ」を機器への命令とも取って「理解できませんでした」と返した。
  oyasumi_switch:
    alias: おやすみスイッチ
    description: 就寝時に部屋の照明を全部消し、空調（エアコンとサーキュレーター）を止める
    icon: mdi:weather-night
    mode: single
    sequence:
      # 0:00 より前に寝る時も玄関の人感センサーで点けないように（entrance_light.yaml）
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.sleeping
      # 止める機器は smart_oyasumi の「消灯」と揃える。クラウドの一時的なエラーで「完了」にし損なわないよう continue_on_error
      - action: script.lights
        continue_on_error: true
        data:
          target: all
          "on": false
      - action: switch.turn_off
        continue_on_error: true
        target:
          entity_id: switch.kucho
      # スマートおやすみ（smart_oyasumi.yaml）の以降の段階を止める
      - action: input_select.select_option
        target:
          entity_id: input_select.oyasumi_stage
        data:
          option: 完了
  # 天気と予定の読み上げは Google のルーティン側（このスイッチをオンにするアクションの前に置く）。
  # 天井の電球は wake_light がアラーム前から点けているので触らない。
  # Google の「音楽」アクションは文で検索するので別の曲が流れた。Music Assistant で ID を指定して流す
  ohayo_switch:
    alias: おはようスイッチ
    description: 起床時にメインのスピーカーで YouTube Music の「モーニングサウンド」を流す
    icon: mdi:weather-sunset-up
    mode: single
    sequence:
      # library://playlist/51 は Music Assistant のライブラリに入れた「モーニングサウンド」。
      # 普通の YouTube 動画は再生できない。曲を入れ替えたら Music Assistant の画面でプレイリストを Refresh する（古い中身のままだと No playable items）
      - action: music_assistant.play_media
        target:
          entity_id: media_player.ma_main
        data:
          media_id: library://playlist/51
          media_type: playlist
  ittekimasu:
    alias: いってきます
    description: 外出時に部屋の照明を全部消し、エアコンを止め、サーキュレーターを回す
    icon: mdi:home-export-outline
    mode: single
    sequence:
      - action: script.lights
        data:
          target: all
          "on": false
      - action: climate.set_hvac_mode
        target:
          entity_id: climate.aircon
        data:
          hvac_mode: "off"
      - action: switch.turn_on
        target:
          entity_id: switch.circulator
  tadaima:
    alias: ただいま
    description: 帰宅時に部屋の電球を点け（色・明るさは電球の前回値）、サーキュレーターを止める（玄関の間接照明は人感センサーが点ける）
    icon: mdi:home-import-outline
    mode: single
    sequence:
      - action: light.turn_on
        target:
          entity_id:
            - light.ceiling_left
            - light.ceiling_center
            - light.ceiling_right
      - action: switch.turn_off
        target:
          entity_id: switch.circulator
