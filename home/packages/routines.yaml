# Google の同名ルーティンが Matter Hub 経由で「オン」にする script（label `matter`）。
# Matter からは引数を渡せないので、照明は script.lights を固定の引数で呼ぶ。
script:
  # 名前をルーティンの開始フレーズ「おやすみ」と同じにすると、Gemini for Home が
  # 「おやすみ」を機器への命令とも取って「理解できませんでした」と返した。
  oyasumi_switch:
    alias: おやすみスイッチ
    description: 就寝時に部屋の照明を全部消し、エアコンを止める
    icon: mdi:weather-night
    mode: single
    sequence:
      # 0:00 より前に寝る時も玄関の人感センサーで点けないように（entrance_light.yaml）
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.sleeping
      - action: script.lights
        data:
          target: all
          "on": false
      - action: climate.set_hvac_mode
        target:
          entity_id: climate.aircon
        data:
          hvac_mode: "off"
  ittekimasu:
    alias: いってきます
    description: 外出時に部屋の照明を全部消し、エアコンを止め、サーキュレーターを回す
    icon: mdi:home-export-outline
    mode: single
    sequence:
      - action: script.lights
        data:
          target: all
          "on": false
      - action: climate.set_hvac_mode
        target:
          entity_id: climate.aircon
        data:
          hvac_mode: "off"
      - action: switch.turn_on
        target:
          entity_id: switch.circulator
  tadaima:
    alias: ただいま
    description: 帰宅時に部屋の電球を点け（色・明るさは電球の前回値）、サーキュレーターを止める（玄関の間接照明は人感センサーが点ける）
    icon: mdi:home-import-outline
    mode: single
    sequence:
      - action: light.turn_on
        target:
          entity_id:
            - light.ceiling_left
            - light.ceiling_center
            - light.ceiling_right
      - action: switch.turn_off
        target:
          entity_id: switch.circulator
