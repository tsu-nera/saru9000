# 起床時刻を HA に持ち、Sleep as Android にアラームを書いて、朝の段階を進める（smart_oyasumi の朝側）。
# 鳴動・スヌーズ・解除は Sleep as Android の event entity（webhook 経由）から受ける。
# 完了は離床: 鳴動の 10 分後にカメラで寝袋が片付いていれば完了、いなければ電話とキッチンで呼び、玄関の人感で完了。
input_boolean:
  # 本人だけが切り替える。自動では戻さない
  smart_ohayo:
    name: スマートおはよう
    icon: mdi:weather-sunset-up

# initial を付けると HA の再起動のたびに戻るので付けない。既定 05:45 は一度だけ service で入れる（home/AGENTS.md）
input_datetime:
  ohayo_time:
    name: 起床時刻
    has_date: false
    has_time: true

input_select:
  ohayo_stage:
    name: おはようの段階
    options:
      - 待機
      - アラーム設定済み
      - 鳴動
      - スヌーズ
      - 強める
      - 解除
      - 呼び出し
      - 完了
  # 起床の判定の最新の結果（bed_check.py が書く）。記録と script.check_awake の受け渡し用で、条件には使わない
  ohayo_bed:
    name: 寝袋の片付け
    options:
      - 未判定
      - 判定中
      - 片付けた
      - 片付けていない
      - 失敗

# HA コンテナから vaio ホストの bed_check.sh を呼ぶ。鍵は authorized_keys の command= で bed_check.sh に固定（README）
shell_command:
  bed_check: ssh -i /config/.ssh/ha_bed_check -o UserKnownHostsFile=/config/.ssh/known_hosts -o BatchMode=yes tsu-nera@127.0.0.1 run

script:
  # 起きたかの判定の道具。どの automation からも response_variable で結果を受け取れる
  check_awake:
    alias: 起きたか確かめる
    description: >-
      カメラで丸めた寝袋が片付いているかを判定し（約 40 秒、その間 privacy mode が切れる）、
      result に 片付けた・片付けていない・失敗 を返す。
    mode: queued
    sequence:
      - action: input_select.select_option
        target:
          entity_id: input_select.ohayo_bed
        data:
          option: 判定中
      - action: shell_command.bed_check
        continue_on_error: true
      # 結果は bed_check.py が input_select.ohayo_bed に書く（privacy を切って 15 秒待ち＋claude）
      - wait_for_trigger:
          - trigger: state
            entity_id: input_select.ohayo_bed
            from: 判定中
        timeout: "00:03:00"
      - if:
          - condition: state
            entity_id: input_select.ohayo_bed
            state: 判定中
        then:
          - action: input_select.select_option
            target:
              entity_id: input_select.ohayo_bed
            data:
              option: 失敗
      - variables:
          out:
            result: "{{ states('input_select.ohayo_bed') }}"
      - stop: 判定した
        response_variable: out

  set_phone_alarm:
    alias: スマホのアラームを書く
    description: ラベル saru9000 の Sleep as Android のアラームを、起床時刻の次の時刻に書き直す（スマホ側で編集した他のアラームは触らない）
    mode: single
    variables:
      hh: "{{ states('input_datetime.ohayo_time')[0:2] | int }}"
      mm: "{{ states('input_datetime.ohayo_time')[3:5] | int }}"
      expected: >-
        {% set t = today_at(states('input_datetime.ohayo_time')) %}
        {{ (t + timedelta(days=1) if t <= now() else t).isoformat() }}
    sequence:
      # Sleep as Android は DISMISS_ALARM に対応しないので、ラベルを指定して無効にする。対象は saru9000 のアラームだけ
      - action: notify.mobile_app_xiaomi
        data:
          message: command_broadcast_intent
          data:
            intent_action: com.urbandroid.sleep.alarmclock.ALARM_STATE_CHANGE
            intent_package_name: com.urbandroid.sleep
            intent_extras: "alarm_label:saru9000,alarm_enabled:false"
      - delay: 5
      # Companion App の「他のアプリの上に表示」と MIUIOP(10021)（adb で付与）が要る。
      # SKIP_UI でも Sleep as Android の画面が前面に出るので、使っていない 21:00 に書く
      - action: notify.mobile_app_xiaomi
        data:
          message: command_activity
          data:
            intent_action: android.intent.action.SET_ALARM
            intent_package_name: com.urbandroid.sleep
            intent_extras: >-
              android.intent.extra.alarm.HOUR:{{ hh }},android.intent.extra.alarm.MINUTES:{{ mm }},android.intent.extra.alarm.MESSAGE:saru9000,android.intent.extra.alarm.SKIP_UI:true
      # 確認は Sleep as Android の webhook で返る。sensor.xiaomi_next_alarm は Companion App が
      # LOW_MEMORY でよく落ちて更新されないので使わない
      - wait_template: "{{ (states('sensor.sleep_as_android_next_alarm') | as_datetime(none)) == (expected | as_datetime) }}"
        timeout: "00:05:00"
        continue_on_timeout: true
      - if:
          - condition: template
            value_template: "{{ wait.completed }}"
        then:
          - action: input_select.select_option
            target:
              entity_id: input_select.ohayo_stage
            data:
              option: アラーム設定済み
        else:
          - action: notify.mobile_app_bv5200_pro
            continue_on_error: true
            data:
              title: おはよう
              message: アラームを書けませんでした。手で入れてください
          - action: notify.mobile_app_iiyama2026
            continue_on_error: true
            data:
              title: おはよう
              message: アラームを書けませんでした。手で入れてください
          - action: notify.mobile_app_cachyos
            continue_on_error: true
            data:
              title: おはよう
              message: アラームを書けませんでした。手で入れてください

automation:
  - id: ohayo_write_alarm
    alias: Ohayo Write Alarm
    description: 毎晩 21:00 と起床時刻を変えた時に、スマホのアラームを起床時刻へ書き直す。スマートおはようが on の時だけ。
    mode: single
    triggers:
      - trigger: time
        at: "21:00:00"
      - trigger: state
        entity_id: input_datetime.ohayo_time
    conditions:
      - condition: state
        entity_id: input_boolean.smart_ohayo
        state: "on"
    actions:
      - action: script.set_phone_alarm

  - id: ohayo_events
    alias: Ohayo Events
    description: >-
      Sleep as Android のアラームの鳴動・スヌーズ・解除で段階を進める。鳴動から 15 分たっても止まらず、在宅なら
      照明を 100%・6500K にする（再び鳴るたびに 15 分を数え直す）。呼び出し・完了の後は段階を変えない（ohayo_bed_check が持つ）。
    # restart が「再び鳴るたびに 15 分を数え直す」の実装。鳴動後の別のイベント（スヌーズ・解除）が
    # 実行を作り直して待ちの delay を捨てるので、wait_for_trigger は要らない。HA の再起動では待ちが消える（許容）
    mode: restart
    triggers:
      - trigger: state
        entity_id: event.sleep_as_android_alarm_clock
        # HA の再起動・reload で unavailable から前回の event に戻る変化を拾わない（夜中に前回の alert_dismiss などで発火する）
        not_from:
          - unavailable
          - unknown
        not_to:
          - unavailable
          - unknown
    conditions:
      - condition: state
        entity_id: input_boolean.smart_ohayo
        state: "on"
      - condition: not
        conditions:
          - condition: state
            entity_id: input_select.ohayo_stage
            state:
              - 呼び出し
              - 完了
    variables:
      et: "{{ trigger.to_state.attributes.event_type }}"
    actions:
      - choose:
          - conditions:
              - condition: template
                value_template: "{{ et == 'alert_start' }}"
            sequence:
              - action: input_select.select_option
                target:
                  entity_id: input_select.ohayo_stage
                data:
                  option: 鳴動
              - delay: "00:15:00"
              # 15 分の間に完了（離床）していたら何もしない。呼び出し中は照明だけ上げ、段階は呼び出しのまま
              - condition: not
                conditions:
                  - condition: state
                    entity_id: input_select.ohayo_stage
                    state: 完了
              - condition: state
                entity_id: person.tsunemichi_harada
                state: home
              - if:
                  - condition: not
                    conditions:
                      - condition: state
                        entity_id: input_select.ohayo_stage
                        state: 呼び出し
                then:
                  - action: input_select.select_option
                    target:
                      entity_id: input_select.ohayo_stage
                    data:
                      option: 強める
              # SwitchBot Cloud の一時的なエラーで止めない
              - action: light.turn_on
                continue_on_error: true
                target:
                  entity_id: light.ceiling
                data:
                  brightness_pct: 100
                  color_temp_kelvin: 6500
          - conditions:
              - condition: template
                value_template: "{{ et == 'snooze_clicked' }}"
            sequence:
              - action: input_select.select_option
                target:
                  entity_id: input_select.ohayo_stage
                data:
                  option: スヌーズ
          - conditions:
              - condition: template
                value_template: "{{ et == 'alert_dismiss' }}"
            sequence:
              # 布団の中でも止められるので完了にはしない
              - action: input_select.select_option
                target:
                  entity_id: input_select.ohayo_stage
                data:
                  option: 解除

  - id: ohayo_bed_check
    alias: Ohayo Bed Check
    description: >-
      その朝最初の鳴動から 10 分後、在宅なら script.check_awake で丸めた寝袋が片付いているか見る。
      片付いていれば完了。そうでなければ（判定の失敗も）スマホに1回電話し、キッチンで 30 秒おきに呼び、玄関の人感で完了にする（30 分で諦める）。
    mode: single
    max_exceeded: silent
    triggers:
      - trigger: state
        entity_id: event.sleep_as_android_alarm_clock
        not_from:
          - unavailable
          - unknown
        not_to:
          - unavailable
          - unknown
    conditions:
      - condition: state
        entity_id: input_boolean.smart_ohayo
        state: "on"
      - condition: template
        value_template: "{{ trigger.to_state.attributes.event_type == 'alert_start' }}"
      # その朝最初の鳴動だけ（スヌーズ後の鳴動では数え直さない）。動くと last_triggered が更新される
      - condition: template
        value_template: >-
          {% set last = state_attr(this.entity_id, 'last_triggered') %}
          {{ last is none or now() - last > timedelta(hours=12) }}
    actions:
      - delay: "00:10:00"
      - condition: state
        entity_id: person.tsunemichi_harada
        state: home
      - action: script.check_awake
        response_variable: bed
      - if:
          - condition: template
            value_template: "{{ bed.result == '片付けた' }}"
        then:
          - action: input_select.select_option
            target:
              entity_id: input_select.ohayo_stage
            data:
              option: 完了
          - stop: 片付けた
      - action: input_select.select_option
        target:
          entity_id: input_select.ohayo_stage
        data:
          option: 呼び出し
      # 電話は呼び出し（最長45秒）と読み上げが終わるまで返らないので、待たずに投げてキッチンの呼び出しと並べる。
      # 結果は script.phone_call の trace。script が無い（phone サービスを入れる前）時も turn_on は警告だけで止まらない
      - action: script.turn_on
        target:
          entity_id: script.phone_call
        data:
          variables:
            text: "{{ states('input_text.call_name') }}さん、おはようございます。"
      - variables:
          deadline: "{{ (now() + timedelta(minutes=30)).isoformat() }}"
      # Cast は繰り返し再生できないので送り直す。声やアプリで止めても次の回でまた鳴る
      - repeat:
          sequence:
            - action: tts.speak
              continue_on_error: true
              target:
                entity_id: tts.googlefan_yi_en_com_google_translate_en_com
              data:
                media_player_entity_id: media_player.kitchen_speaker
                message: 起きてますか？玄関にきてください。
                language: ja
            - wait_for_trigger:
                - trigger: state
                  entity_id: binary_sensor.atoms3_entrance_motion
                  from: "off"
                  to: "on"
              timeout: "00:00:30"
            - if:
                - condition: template
                  value_template: "{{ wait.trigger is not none }}"
              then:
                - action: input_select.select_option
                  target:
                    entity_id: input_select.ohayo_stage
                  data:
                    option: 完了
          until:
            - condition: template
              value_template: "{{ is_state('input_select.ohayo_stage', '完了') or now() >= as_datetime(deadline) }}"

  - id: ohayo_reset
    alias: Ohayo Reset
    description: 毎日 12:00 に段階を「待機」、寝袋の判定の表示を「未判定」へ戻す。
    mode: single
    triggers:
      - trigger: time
        at: "12:00:00"
    actions:
      - action: input_select.select_option
        target:
          entity_id: input_select.ohayo_stage
        data:
          option: 待機
      - action: input_select.select_option
        target:
          entity_id: input_select.ohayo_bed
        data:
          option: 未判定
