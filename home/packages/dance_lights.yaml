input_text:
  # ダンス前から manual（手で明るさ・色を変えた）だった電球。ダンス後もその明るさを保つため manual のまま残す
  dance_lights_manual:
    name: Dance Lights Manual
    max: 255

script:
  dance_lights_blackout:
    alias: Dance Lights Blackout
    description: >-
      ダンスの掛け声の前に天井の電球 3 個と間接照明の今の状態を scene.before_dance に、
      すでに manual だった電球を input_text.dance_lights_manual に保存し、
      Adaptive Lighting を manual にして全部消す。
    mode: restart
    variables:
      lights:
        - light.ceiling_left
        - light.ceiling_center
        - light.ceiling_right
      # 赤外線の on/off だけの template light。Adaptive Lighting の対象外なので manual は扱わない
      indirect: light.indirect_light
    sequence:
      # snapshot_entities は使わない: 色温度で点いている SwitchBot 電球は rgb_color [0, 0, 0] と報告され、
      # 戻す時に Cloud が「color 0:0:0 is not allowed」で拒む。点灯・明るさ・色温度（本物の色なら rgb）だけ残す。
      - action: scene.create
        data:
          scene_id: before_dance
          entities: >-
            {%- set ns = namespace(items=[]) %}
            {%- for l in lights %}
              {%- set a = {'state': states(l)} %}
              {%- if is_state(l, 'on') %}
                {%- set bri = state_attr(l, 'brightness') %}
                {%- set rgb = state_attr(l, 'rgb_color') %}
                {%- set kelvin = state_attr(l, 'color_temp_kelvin') %}
                {%- if bri is not none %}{% set a = dict(a, brightness=bri) %}{% endif %}
                {%- if state_attr(l, 'color_mode') == 'rgb' and rgb is not none and rgb | list != [0, 0, 0] %}
                  {%- set a = dict(a, rgb_color=rgb | list) %}
                {%- elif kelvin is not none %}
                  {%- set a = dict(a, color_temp_kelvin=kelvin) %}
                {%- endif %}
              {%- endif %}
              {%- set ns.items = ns.items + [(l, a)] %}
            {%- endfor %}
            {%- set ns.items = ns.items + [(indirect, {'state': states(indirect)})] %}
            {{ dict(ns.items) }}
      - action: input_text.set_value
        target:
          entity_id: input_text.dance_lights_manual
        data:
          value: >-
            {{ (state_attr('switch.adaptive_lighting_ceiling', 'manual_control') or [])
               | select('in', lights) | join(',') }}
      - action: adaptive_lighting.set_manual_control
        data:
          entity_id: switch.adaptive_lighting_ceiling
          lights: "{{ lights }}"
          manual_control: true
      - action: light.turn_off
        target:
          entity_id: "{{ lights + [indirect] }}"

  dance_lights:
    alias: Dance Lights
    description: >-
      曲のあいだ 3 秒ごとにミクの色（ティール・ピンク・白）を左・中央・右でずらして点け、
      1 段ごとに色を回す。いちばん長い曲（テルユアワールド完全版、約 260 秒）を覆う約 270 秒で止まる。
    mode: restart
    variables:
      lights:
        - light.ceiling_left
        - light.ceiling_center
        - light.ceiling_right
      colors:
        - [57, 197, 187]
        - [255, 105, 180]
        - [255, 255, 255]
      steps: 90
      step_seconds: 3
      start: "{{ as_timestamp(now()) }}"
    sequence:
      - repeat:
          count: "{{ steps }}"
          sequence:
            # 内側の repeat から外側の repeat.index は見えないので先に取っておく
            - variables:
                step: "{{ repeat.index }}"
            - repeat:
                for_each: "{{ range(lights | length) | list }}"
                sequence:
                  - action: light.turn_on
                    target:
                      entity_id: "{{ lights[repeat.item] }}"
                    data:
                      rgb_color: "{{ colors[(repeat.item + step) % (colors | length)] }}"
                      brightness_pct: 100
            # Cloud の遅延が積もらないよう開始時刻から数えて待つ
            - delay:
                seconds: "{{ [0, start + step_seconds * step - as_timestamp(now())] | max }}"

  dance_lights_end:
    alias: Dance Lights End
    description: >-
      色回しを止め、電球と間接照明を scene.before_dance に戻し、ダンス前は manual でなかった電球だけ
      Adaptive Lighting の manual を解く。
    mode: restart
    variables:
      lights:
        - light.ceiling_left
        - light.ceiling_center
        - light.ceiling_right
      saved: "{{ states('input_text.dance_lights_manual').split(',') }}"
      kept: "{{ lights | select('in', saved) | list }}"
      released: "{{ lights | reject('in', saved) | list }}"
    sequence:
      - action: script.turn_off
        target:
          entity_id: script.dance_lights
      # 消した時に Adaptive Lighting が manual を解いているので、点け直す前に付け直す。
      # 付けずに点けると Adaptive Lighting が自分の明るさに変える
      - if: "{{ kept | length > 0 }}"
        then:
          - action: adaptive_lighting.set_manual_control
            data:
              entity_id: switch.adaptive_lighting_ceiling
              lights: "{{ kept }}"
              manual_control: true
      # 戻せなくても manual は解く（解かないと次に消すまで Adaptive Lighting に戻らない）
      - action: scene.turn_on
        continue_on_error: true
        target:
          entity_id: scene.before_dance
      - if: "{{ released | length > 0 }}"
        then:
          - action: adaptive_lighting.set_manual_control
            data:
              entity_id: switch.adaptive_lighting_ceiling
              lights: "{{ released }}"
              manual_control: false
