# エアコン（Nature Remo の climate.aircon）の補助。
# この integration には turn_on が無く、止まっている時に温度・風量を送るとモードが無くて失敗する。
# 最後に使ったモードを覚えておき、止まっていればそのモードで動かしてから操作する。
template:
  - triggers:
      - trigger: state
        entity_id: climate.aircon
        not_to:
          - "off"
          - unavailable
          - unknown
    sensor:
      - name: Aircon Last Mode
        unique_id: aircon_last_mode
        state: "{{ trigger.to_state.state }}"

script:
  aircon_power_on:
    alias: Aircon Power On
    description: 止まっていれば最後に使ったモード（覚えていなければ自動）でエアコンを動かす。動いていれば何もしない。
    mode: queued
    sequence:
      - if:
          - condition: state
            entity_id: climate.aircon
            state: "off"
        then:
          - action: climate.set_hvac_mode
            target:
              entity_id: climate.aircon
            data:
              hvac_mode: >-
                {% set last = states('sensor.aircon_last_mode') %}
                {{ last if last in state_attr('climate.aircon', 'hvac_modes') and last != 'off' else 'auto' }}
