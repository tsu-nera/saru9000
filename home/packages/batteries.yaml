# 充電を忘れがちな周辺機器の電池を1か所に集める。device_class: battery にするとメンテナンスのページにも出る。
template:
  # BT マウス（ELECOM shellpha）は iiyama と mouse を切り替えて使う同じ1台。繋ぐ PC ごとに別のアドレスを使うので、
  # go-hass-agent の entity も PC ごとに別にできる。切断中や bluetooth の再起動で None になるので、数値が届いた時だけ採る
  # （None になった時に他方の古い値へ戻らないよう、state トリガーでは届いた側しか見ない）。
  - triggers:
      - trigger: state
        entity_id:
          - sensor.iiyama_iiyama2026_elecom_shellpha_battery_level
          - sensor.mouse_elecom_shellpha_battery_level
      - trigger: homeassistant
        event: start
      - trigger: event
        event_type: event_template_reloaded
    sensor:
      - name: マウス 電池
        unique_id: bt_mouse_battery
        default_entity_id: sensor.bt_mouse_battery
        device_class: battery
        unit_of_measurement: "%"
        state_class: measurement
        # 起動・reload の時は、値が無ければ2つのうち新しい数値で埋める
        state: >-
          {% if trigger.platform == 'state' %}
            {{ trigger.to_state.state | int if trigger.to_state.state | is_number else this.state }}
          {% elif this.state | is_number %}
            {{ this.state }}
          {% else %}
            {% set c = [states.sensor.iiyama_iiyama2026_elecom_shellpha_battery_level,
                        states.sensor.mouse_elecom_shellpha_battery_level]
                       | reject('none') | selectattr('state', 'is_number') | sort(attribute='last_changed') | list %}
            {{ c[-1].state | int if c else none }}
          {% endif %}
        attributes:
          source: >-
            {% if trigger.platform == 'state' and trigger.to_state.state | is_number %}
              {{ 'iiyama' if 'iiyama' in trigger.entity_id else 'mouse' }}
            {% else %}
              {{ this.attributes.get('source') }}
            {% endif %}

  # スマホ（Xiaomi）の Tasker が、スマホからしか読めない機器の残量を webhook に POST する（#142）。
  # 本文は {"device": "tickr|liberty|liberty_case|xm3|wimax", "level": 0-100}（Content-Type: application/json）。送り方は home/tasker/。
  # どの機器も繋いだ時にしか値が来ないので、届いた機器の値だけ更新し、ほかは前の値と reported_at を保つ。
  # webhook は認証が無く ID を知っていれば誰でも書ける。ID は vaio の git 外 secrets.yaml の phone_battery_webhook_id。
  - triggers:
      - trigger: webhook
        webhook_id: !secret phone_battery_webhook_id
        allowed_methods: [POST]
        # スマホは Tailscale（100.x）から来るので local 判定に入らない
        local_only: false
    sensor:
      - name: TICKR 電池
        unique_id: tickr_battery
        default_entity_id: sensor.tickr_battery
        device_class: battery
        unit_of_measurement: "%"
        state_class: measurement
        state: >-
          {% set j = trigger.json if trigger.json is defined else {} %}
          {{ j.level if j.get('device') == 'tickr' and j.get('level') is number else this.state }}
        attributes:
          reported_at: >-
            {% set j = trigger.json if trigger.json is defined else {} %}
            {{ now().isoformat() if j.get('device') == 'tickr' and j.get('level') is number else this.attributes.get('reported_at') }}
      - name: Liberty 4 Pro 電池
        unique_id: liberty_battery
        default_entity_id: sensor.liberty_battery
        device_class: battery
        unit_of_measurement: "%"
        state_class: measurement
        state: >-
          {% set j = trigger.json if trigger.json is defined else {} %}
          {{ j.level if j.get('device') == 'liberty' and j.get('level') is number else this.state }}
        attributes:
          reported_at: >-
            {% set j = trigger.json if trigger.json is defined else {} %}
            {{ now().isoformat() if j.get('device') == 'liberty' and j.get('level') is number else this.attributes.get('reported_at') }}
      # ケースは earbuds.bsh がイヤホンの値と一緒に送る（ケースだけ変わった時は届かない）
      - name: Liberty 4 Pro ケース 電池
        unique_id: liberty_case_battery
        default_entity_id: sensor.liberty_case_battery
        device_class: battery
        unit_of_measurement: "%"
        state_class: measurement
        state: >-
          {% set j = trigger.json if trigger.json is defined else {} %}
          {{ j.level if j.get('device') == 'liberty_case' and j.get('level') is number else this.state }}
        attributes:
          reported_at: >-
            {% set j = trigger.json if trigger.json is defined else {} %}
            {{ now().isoformat() if j.get('device') == 'liberty_case' and j.get('level') is number else this.attributes.get('reported_at') }}
      - name: WH-1000XM3 電池
        unique_id: xm3_battery
        default_entity_id: sensor.xm3_battery
        device_class: battery
        unit_of_measurement: "%"
        state_class: measurement
        state: >-
          {% set j = trigger.json if trigger.json is defined else {} %}
          {{ j.level if j.get('device') == 'xm3' and j.get('level') is number else this.state }}
        attributes:
          reported_at: >-
            {% set j = trigger.json if trigger.json is defined else {} %}
            {{ now().isoformat() if j.get('device') == 'xm3' and j.get('level') is number else this.attributes.get('reported_at') }}
      - name: WiMAX 電池
        unique_id: wimax_battery
        default_entity_id: sensor.wimax_battery
        device_class: battery
        unit_of_measurement: "%"
        state_class: measurement
        state: >-
          {% set j = trigger.json if trigger.json is defined else {} %}
          {{ j.level if j.get('device') == 'wimax' and j.get('level') is number else this.state }}
        attributes:
          reported_at: >-
            {% set j = trigger.json if trigger.json is defined else {} %}
            {{ now().isoformat() if j.get('device') == 'wimax' and j.get('level') is number else this.attributes.get('reported_at') }}
