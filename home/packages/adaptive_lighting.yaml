adaptive_lighting:
  # name は switch の unique_id の元。変えると別の entity として作り直され on/off が引き継がれないので denkyu のまま。
  # entity ID は registry で switch.adaptive_lighting_ceiling* に付け替えてある。
  - name: denkyu
    lights:
      - light.ceiling_left
      - light.ceiling_center
      - light.ceiling_right
    interval: 300
    transition: 0
    initial_transition: 0
    sleep_transition: 0
    min_brightness: 10
    min_color_temp: 2700
    sleep_color_temp: 2700
    brightness_mode: tanh
    # true 必須。SwitchBot Cloud は点灯の state を数秒後のポーリングで別 context として上げるので、false だと
    # 点けた直後に「HA の外で点けられた」と見て manual_control にし追従を止める。代わりに interval ごとに Cloud API を叩く
    detect_non_ha_changes: true
    skip_redundant_commands: true
