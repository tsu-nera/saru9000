# 消灯から一定時間、スマホ（Xiaomi）の YouTube と Claude を一時停止（package suspend）する（#169）。
# 止める・戻す実体はスマホの Tasker（home/tasker/app_block.bsh）。HA は broadcast で指示し、Tasker の webhook で結果を受ける。
# 戻すのは Tasker 自身（止めた時刻から app_block.bsh の HOURS 後に AlarmManager で予約）。HA は時刻を持たず、
# Tasker が返す「戻す時刻」を input_datetime.app_block_until に写して表示するだけ。
input_boolean:
  # スマホ側で実際に止まっているかの写し。Tasker の webhook でだけ切り替える（操作は switch.app_block）
  app_block:
    name: 夜のアプリ停止（状態）
    icon: mdi:cellphone-lock

input_datetime:
  app_block_until:
    name: 夜のアプリ停止の解除時刻
    has_date: true
    has_time: true

# HA から Tasker の HTTP サーバー（1821）へ直接指示する。URL（スマホの Tailscale IP と推測されにくいパス）は
# vaio の git 外 secrets.yaml の app_block_url。応答の本文は app_block.bsh の戻り値
rest_command:
  app_block:
    url: !secret app_block_url
    method: POST
    content_type: application/json
    payload: '{"block": {{ block | tojson }}, "force": {{ force | default(false) | tojson }}}'
    # Shizuku でのシェル（最大 30 秒）と webhook への POST を待つ
    timeout: 60

script:
  # Tasker へ指示する。HTTP が届いて失敗した時（Shizuku が止まっている等）は 5 分後に HTTP を送り直す。
  # 届かない時（スマホの Tailscale が落ちている等）は Companion App 経由の broadcast を送り、Tasker の結果
  # （app_block_reported）を 5 分待つ。どちらかで結果が返るまで最大 6 回繰り返す
  app_block_send:
    alias: App Block Send
    mode: restart
    fields:
      block:
        selector:
          boolean:
      force:
        selector:
          boolean:
    sequence:
      - repeat:
          sequence:
            # 前の周の応答を残さない（失敗すると response_variable は書き換わらない）
            - variables:
                http: {}
            - action: rest_command.app_block
              continue_on_error: true
              response_variable: http
              data:
                block: "{{ block }}"
                force: "{{ force | default(false) }}"
            # 本文は app_block.bsh の戻り値。denied は vaio 以外から来た扱いなので届いていないとみなす
            - variables:
                arrived: "{{ http.get('status') == 200 and (http.get('content') | string) not in ['', 'denied'] }}"
                reported: "{{ arrived and (http.get('content') | string) != 'failed' }}"
            - if:
                - condition: template
                  value_template: "{{ not reported and arrived }}"
              then:
                - delay: "00:05:00"
            - if:
                - condition: template
                  value_template: "{{ not arrived }}"
              then:
                - action: notify.mobile_app_xiaomi
                  data:
                    message: command_broadcast_intent
                    data:
                      intent_action: saru9000.APP_BLOCK
                      intent_package_name: net.dinglisch.android.taskerm
                      intent_extras: "block:{{ 'true' if block else 'false' }},force:{{ 'true' if force | default(false) else 'false' }}"
                - wait_for_trigger:
                    - trigger: event
                      event_type: app_block_reported
                  timeout: "00:05:00"
                - variables:
                    reported: "{{ wait.trigger is not none }}"
          until:
            - condition: template
              value_template: "{{ reported or repeat.index >= 6 }}"

template:
  # 表示名「夜のアプリ停止」は entity registry 側（ここに日本語を書くと entity ID が中国語読みになる）
  - switch:
      - name: App Block
        unique_id: app_block
        default_entity_id: switch.app_block
        icon: mdi:cellphone-lock
        state: "{{ is_state('input_boolean.app_block', 'on') }}"
        turn_on:
          - action: script.turn_on
            target:
              entity_id: script.app_block_send
            data:
              variables:
                block: true
        # 手で押した時は解除時刻を待たずに戻す（Tasker 側は force が無いと断る）
        turn_off:
          - action: script.turn_on
            target:
              entity_id: script.app_block_send
            data:
              variables:
                block: false
                force: true

automation:
  - id: app_block_command
    alias: App Block Command
    description: >-
      段階が「消灯」か「完了」になったら止め、「消灯」から「延長」で戻すよう Tasker に指示する。
    mode: queued
    triggers:
      # 「おやすみ」を就寝時刻より先に言うと「消灯」は来ないので「完了」でも止める
      - trigger: state
        entity_id: input_select.oyasumi_stage
        to:
          - 消灯
          - 完了
        id: block
      # 延長後の「消灯」で再び止まる。止めて数分なので解除時刻を待たずに戻す
      - trigger: state
        entity_id: input_select.oyasumi_stage
        from: 消灯
        to: 延長
        id: unblock
    actions:
      - action: script.turn_on
        target:
          entity_id: script.app_block_send
        data:
          variables:
            block: "{{ trigger.id == 'block' }}"
            force: "{{ trigger.id == 'unblock' }}"

  # Tasker が止める・戻すの後と、解除時刻前の解除を断った時に {"block": bool, "until": epoch 秒 | null} を POST する。
  # webhook は認証が無く ID を知っていれば誰でも書ける。ID は vaio の git 外 secrets.yaml の app_block_webhook_id。
  - id: app_block_report
    alias: App Block Report
    description: Tasker から届いた結果で input_boolean.app_block と解除時刻を合わせる。
    mode: queued
    triggers:
      - trigger: webhook
        webhook_id: !secret app_block_webhook_id
        allowed_methods: [POST]
        # スマホは Tailscale（100.x）から来るので local 判定に入らない
        local_only: false
    conditions:
      - condition: template
        value_template: "{{ trigger.json is defined and trigger.json.get('block') in [true, false] }}"
    actions:
      - action: "input_boolean.turn_{{ 'on' if trigger.json.block else 'off' }}"
        target:
          entity_id: input_boolean.app_block
      - if:
          - condition: template
            value_template: "{{ trigger.json.get('until') is number }}"
        then:
          - action: input_datetime.set_datetime
            target:
              entity_id: input_datetime.app_block_until
            data:
              timestamp: "{{ trigger.json.until }}"
      - event: app_block_reported
        event_data:
          block: "{{ trigger.json.block }}"
